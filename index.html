      * { box-sizing: border-box; }

      [hidden] { display: none !important; }

      html, body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        color: var(--ink);
        background: var(--paper);
        cursor: auto;
        font-family: "Portfolio MingLiU", MingLiU, serif;
        font-synthesis: weight;
        font-size: var(--type-size);
        line-height: var(--line-height);
        letter-spacing: 0;
      }

      a, button, [role="button"], [role="link"] { cursor: pointer; }

      /* ── pages ── */
      .page { display: none; }
      .page.is-visible { display: block; }

      /* ── home ── */
      .site-shell {
        position: relative;
        width: 100vw;
        height: 100dvh;
        overflow: hidden;
        padding: clamp(12px, 1.25vw, 18px);
      }

      .masthead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        min-width: 0;
        white-space: nowrap;
      }

      .masthead h1 {
        flex: 0 0 auto;
        margin: 0;
        font-size: var(--type-size);
        font-weight: 700;
        line-height: 1;
      }

      .nav-hint {
        flex: 0 0 auto;
        margin: 0;
        font-family: var(--mono);
        font-size: var(--hint-size);
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--ink);
        white-space: nowrap;
        opacity: 0.55;
        text-align: right;
      }

      .option-nav {
        display: grid;
        grid-auto-rows: minmax(1.06em, auto);
        width: min(34rem, calc(100vw - 24px));
        margin-top: 0.18em;
      }

      .option-item {
        position: relative;
        display: inline-block;
        width: fit-content;
        max-width: 100%;
        padding: 0 1.05em 0 0;
        color: var(--ink);
        text-decoration: none;
        outline: 0;
        transition: color 120ms linear;
      }

      .option-item::after {
        content: "<";
        position: absolute;
        right: 0;
        color: transparent;
      }

      .option-item:hover,
      .option-item:focus-visible,
      .option-item.is-active { color: var(--red); }

      .option-item:hover::after,
      .option-item:focus-visible::after,
      .option-item.is-active::after { color: var(--red); }

      .wheel-stage {
        position: absolute;
        right: 0;
        bottom: 0;
        width: var(--wheel-size);
        height: var(--wheel-size);
        overflow: hidden;
        pointer-events: auto;
        z-index: 1;
      }

      .selection-marker {
        fill: var(--red);
        pointer-events: none;
      }

      .portfolio-wheel {
        position: absolute;
        right: 0;
        bottom: 0;
        width: var(--wheel-size);
        height: var(--wheel-size);
        overflow: visible;
      }

      .wheel-rotor {
        transform-origin: 0 0;
        transition: transform 260ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      .star-shape {
        fill: var(--blue);
        stroke: transparent;
        stroke-width: 0;
        vector-effect: non-scaling-stroke;
        pointer-events: auto;
        cursor: pointer;
        touch-action: manipulation;
      }

      .artwork-label {
        fill: var(--ink);
        font-size: 22px;
        font-weight: 400;
        letter-spacing: 0;
        dominant-baseline: middle;
        transition: fill 120ms linear, font-size 120ms linear;
        cursor: pointer;
        pointer-events: auto;
      }

      .artwork-link {
        cursor: pointer;
        pointer-events: auto;
      }

      .artwork-label.is-highlighted {
        fill: var(--highlight-blue);
        font-size: 24px;
      }

      @keyframes cathedralFlash {
        0%, 46% { color: var(--red); fill: var(--red); }
        47%, 100% { color: var(--ink); fill: var(--ink); }
      }

      @keyframes cathedralSelectedFlash {
        0%, 46% { color: var(--highlight-blue); fill: var(--highlight-blue); }
        47%, 100% { color: var(--ink); fill: var(--ink); }
      }

      .artwork-label.is-cathedral {
        font-weight: 700;
        animation: cathedralFlash 520ms steps(1, end) infinite;
      }

      .artwork-label.is-cathedral.is-highlighted {
        animation-name: cathedralSelectedFlash;
      }

      .detail-title.is-cathedral {
        font-size: calc(var(--type-size) * 1.14);
        animation: cathedralSelectedFlash 520ms steps(1, end) infinite;
      }

      .artwork-anchor-ring {
        fill: transparent;
        stroke: transparent;
        stroke-width: 26;
      }

      .wheel-stage.is-active .star-shape { fill: var(--red); }

      .masthead,
      .option-nav {
        position: relative;
        z-index: 2;
      }

      .sr-status {
        position: fixed;
        width: 1px; height: 1px;
        margin: -1px; padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      /* ── detail pages ── */
      .detail-page {
        min-height: 100dvh;
        padding: clamp(12px, 1.25vw, 18px);
        overflow: auto;
      }

      #page-artwork .detail-page {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100dvh;
        overflow: hidden;
      }

      .detail-title,
      .detail-meta,
      .detail-link {
        margin: 0;
        font-size: var(--type-size);
        font-weight: 400;
        line-height: var(--line-height);
      }

      .detail-title { font-weight: 700; }

      .detail-meta {
        margin-top: 0.15em;
        color: var(--blue);
      }

      #page-option .detail-page {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        overflow: hidden;
      }

      .option-content {
        display: flex;
        flex: 1 1 auto;
        min-height: 0;
        align-items: center;
        justify-content: center;
        padding: clamp(18px, 3vw, 44px) 0;
      }

      .about-layout {
        display: flex;
        width: 100%;
        min-height: 0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .about-portrait-wrap {
        display: flex;
        width: 100%;
        min-height: 0;
        flex: 1 1 auto;
        align-items: center;
        justify-content: center;
      }

      .about-portrait {
        display: block;
        width: auto;
        max-width: min(76vw, 680px);
        height: auto;
        max-height: 62dvh;
        object-fit: contain;
      }

      .option-description {
        width: min(62ch, 100%);
        margin: clamp(14px, 2vw, 28px) auto 0;
        font-size: clamp(14px, 1.2vw, 18px);
        font-weight: 400;
        line-height: 1.18;
        text-align: center;
      }

      .option-content.is-contact {
        align-items: flex-start;
        justify-content: flex-start;
        padding-top: clamp(28px, 5vw, 72px);
      }

      .contact-layout {
        width: min(860px, 100%);
      }

      .contact-list {
        display: grid;
        gap: clamp(14px, 2vw, 24px);
        margin: 0;
        padding: 0;

      function clearCathedralCycle() {
        cathedralRunToken += 1;
        cathedralTimers.forEach((resolve, timer) => {
          clearTimeout(timer);
          resolve(false);
        });
        cathedralTimers.clear();
        cathedralWaiters.forEach(resolve => resolve(false));
        cathedralWaiters.clear();
      }

      function randomCathedralIndex(count, excluded = new Set()) {
        const available = Array.from({ length: count }, (_, index) => index)
          .filter(index => !excluded.has(index));
        const pool = available.length ? available : Array.from({ length: count }, (_, index) => index);
        if (!pool.length) return -1;

        let randomValue;
        if (window.crypto && typeof window.crypto.getRandomValues === "function") {
          const values = new Uint32Array(1);
          window.crypto.getRandomValues(values);
          randomValue = values[0] / 4294967296;
        } else {
          randomValue = Math.random();
        }
        return pool[Math.floor(randomValue * pool.length)];
      }

      function preloadCathedralImage(src) {
        return new Promise(resolve => {
          const preloader = new Image();
          preloader.onload = () => resolve(true);
          preloader.onerror = () => resolve(false);
          preloader.src = src;
        });
      }

      function waitForCathedralFade(duration, token) {
        return new Promise(resolve => {
          const timer = setTimeout(() => {
            cathedralTimers.delete(timer);
            resolve(token === cathedralRunToken);
          }, duration);
          cathedralTimers.set(timer, resolve);
        });
      }

      function renderCathedralRandom(item) {
        const block = document.createElement("section");
        block.className = "content-block";
        const grid = document.createElement("div");
        grid.className = "cathedral-random-grid";
        const sources = item.items || [];
        if (!sources.length) return block;

        const token = cathedralRunToken;
        const activeIndexes = [-1, -1];
        const pendingIndexes = [-1, -1];
        const unusedIndexes = new Set(Array.from({ length: sources.length }, (_, index) => index));
        const reservedIndexes = new Set();

        function wakeCathedralWaiters() {
          cathedralWaiters.forEach(resolve => resolve(true));
          cathedralWaiters.clear();
        }

        async function takeCathedralIndex(excluded = new Set()) {
          while (token === cathedralRunToken) {
            if (!unusedIndexes.size) {
              sources.forEach((_, index) => unusedIndexes.add(index));
            }

            const available = [...unusedIndexes]
              .filter(index => !reservedIndexes.has(index) && !excluded.has(index));

            if (available.length) {
              const index = available[randomCathedralIndex(available.length)];
              reservedIndexes.add(index);
              return index;
            }

            const shouldContinue = await new Promise(resolve => cathedralWaiters.add(resolve));
            if (!shouldContinue) return -1;
          }
          return -1;
        }

        function markCathedralIndexUsed(index) {
          reservedIndexes.delete(index);
          unusedIndexes.delete(index);
          wakeCathedralWaiters();
        }

        [0, 1].forEach(slotIndex => {
          const slot = document.createElement("div");
          slot.className = "cathedral-random-slot";
          const image = document.createElement("img");
          image.className = "cathedral-random-image";
          image.alt = `Cathedral image ${slotIndex + 1}`;
          image.draggable = false;
          slot.appendChild(image);
          grid.appendChild(slot);

          const fadeDuration = item.fadeDurations?.[slotIndex] || (slotIndex === 0 ? 5000 : 4000);

          async function runSlot() {
            let nextIndex = await takeCathedralIndex(new Set(activeIndexes));

            while (token === cathedralRunToken && nextIndex >= 0) {
              activeIndexes[slotIndex] = nextIndex;
              pendingIndexes[slotIndex] = -1;
              image.src = sources[nextIndex];
              image.alt = `Cathedral image ${nextIndex + 1}`;
              markCathedralIndexUsed(nextIndex);
              image.style.transition = "none";
              image.style.opacity = "1";
              image.getBoundingClientRect();
              requestAnimationFrame(() => {
                if (token !== cathedralRunToken) return;
                image.style.transition = `opacity ${fadeDuration}ms linear`;
                image.style.opacity = "0";
              });

              const fadeFinished = waitForCathedralFade(fadeDuration, token);
              const excluded = new Set([...activeIndexes, ...pendingIndexes, nextIndex]);
              const candidateIndex = await takeCathedralIndex(excluded);
              if (candidateIndex < 0 || token !== cathedralRunToken) return;
              pendingIndexes[slotIndex] = candidateIndex;
              preloadCathedralImage(sources[candidateIndex]);
              const stillActive = await fadeFinished;
              if (!stillActive || token !== cathedralRunToken) return;
              nextIndex = candidateIndex;
            }
          }

          runSlot();
        });

        block.appendChild(grid);
        return block;
      }

      const artworks = artworkData.map(({ title, slug }) => ({ title, slug }));

      const SVG_NS       = "http://www.w3.org/2000/svg";
      const outerRadius  = 430;
      const innerRadius  = 352;
      const labelRadius  = 470;
      const selectionAngle = 225;
      const markerWidth  = 36;
      const markerHeight = 28;
      const markerMargin = 34;

      function polar(radius, angleDeg) {
        const angle = (angleDeg * Math.PI) / 180;
        return { x: Math.cos(angle) * radius, y: Math.sin(angle) * radius };
      }

      function normalizeAngle(angle) { return ((angle % 360) + 360) % 360; }

      function shortestAngleDistance(a, b) {
        const diff = Math.abs(normalizeAngle(a) - normalizeAngle(b));
        return Math.min(diff, 360 - diff);
      }

      function createSvgElement(tagName, attrs = {}) {
        const node = document.createElementNS(SVG_NS, tagName);
        Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, String(v)));
        return node;
      }

      function ptStr(pts) {
        return pts.map(p => `${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(" ");
      }

      function placeSelectionMarker() {
        const labels = Array.from(document.querySelectorAll(".artwork-label"));
        if (!labels.length) return;

        const longestTitleWidth = Math.max(
          ...labels.map(label => {
            // Use whichever is larger: the real SVG text length (accurate once
            // fonts are loaded) or a per-character estimate (reliable fallback).
            const measured = typeof label.getComputedTextLength === "function"
              ? label.getComputedTextLength()
              : 0;
            const estimated = label.textContent.length * 12;
            return Math.max(measured, estimated);
          })
        );

        // The tip of the triangle must clear the end of the longest label.
        // markerRadius is the centre of the triangle body; the tip is half
        // a markerWidth closer to the origin, so the gap between the text
        // end and the tip is: markerMargin - markerWidth/2.
        // We add extra safety gap so the tip never grazes a label.
        const gap = markerMargin + 36;          // total clear space past text end
        const markerRadius = labelRadius + longestTitleWidth + gap;
        const tip  = polar(markerRadius - markerWidth / 2, selectionAngle);
        const base = polar(markerRadius + markerWidth / 2, selectionAngle);
        const norm = polar(markerHeight / 2, selectionAngle + 90);

        selMarker.setAttribute("points", ptStr([
          tip,
          { x: base.x + norm.x, y: base.y + norm.y },
          { x: base.x - norm.x, y: base.y - norm.y }
        ]));

        // Keep viewBox large enough for all content — adapts to any n of artworks.
        const svgEl = document.querySelector(".portfolio-wheel");
        if (svgEl) {
          const pad    = 20;
          const extent = Math.ceil(markerRadius + markerWidth / 2 + pad);
          svgEl.setAttribute("viewBox", `-${extent} -${extent} ${extent} ${extent}`);
        }
      }

      function shouldFlipLabel(screenAngle) {
        const n = normalizeAngle(screenAngle);
        return n > 90 && n < 270;
      }

      function getReadableLabelRotation(baseAngle, screenAngle) {
        return shouldFlipLabel(screenAngle) ? baseAngle + 180 : baseAngle;
      }

      function updateLabelOrientation() {
        const step = 360 / artworks.length;
        document.querySelectorAll(".artwork-label").forEach((label, i) => {
          const baseAngle   = -90 + i * step;
          const screenAngle = baseAngle + state.wheelRotation;
          const rot         = getReadableLabelRotation(baseAngle, screenAngle);
          const pt          = polar(labelRadius, baseAngle);
          label.setAttribute("transform", `rotate(${rot.toFixed(2)} ${pt.x.toFixed(2)} ${pt.y.toFixed(2)})`);
          label.setAttribute("text-anchor", shouldFlipLabel(screenAngle) ? "end" : "start");
        });
      }

      function getInitialLabelRotation(angle) {
        const n = normalizeAngle(angle);
        return (n > 90 && n < 270) ? angle + 180 : angle;
      }

      function buildWheel() {
        const count = artworks.length;
        const step  = 360 / count;
        const poly  = [];

        for (let i = 0; i < count; i++) {
          const outerAngle = -90 + i * step;
          const innerAngle = outerAngle + step / 2;
          const o = polar(outerRadius, outerAngle);
          const inn = polar(innerRadius, innerAngle);
          poly.push(`${o.x.toFixed(2)},${o.y.toFixed(2)}`);
          poly.push(`${inn.x.toFixed(2)},${inn.y.toFixed(2)}`);
        }

        rotor.appendChild(createSvgElement("polygon", { class: "star-shape", points: poly.join(" ") }));

        artworks.forEach((artwork, i) => {
          const angle    = -90 + i * step;
          const pt       = polar(labelRadius, angle);
          const rot      = getInitialLabelRotation(angle);
          const flip     = rot !== angle;

          // Use a <g> with a click handler instead of <a href> so navigation
          // stays inside the SPA router.
          const g = createSvgElement("g", {
            class: "artwork-link",
            "aria-label": artwork.title,
            "data-nav": "artwork",
            "data-slug": artwork.slug,
            role: "link",
            tabindex: "0",
            style: "cursor: pointer;"
          });
          g.style.cursor = "pointer";
          g.addEventListener("keydown", (e) => {
            if (e.key !== "Enter" && e.key !== " ") return;
            e.preventDefault();
            showPage("artwork", { slug: artwork.slug });
          });

          const text = createSvgElement("text", {
            class: artwork.slug === "cathedral" ? "artwork-label is-cathedral" : "artwork-label",
            x: pt.x.toFixed(2),
            y: pt.y.toFixed(2),
            transform: `rotate(${rot.toFixed(2)} ${pt.x.toFixed(2)} ${pt.y.toFixed(2)})`,
            "text-anchor": flip ? "end" : "start",
            "data-index": i
          });

          text.textContent = artwork.title;
          g.appendChild(text);
          rotor.appendChild(g);
        });

        placeSelectionMarker();
        document.fonts?.ready?.then(placeSelectionMarker);
      }

      function updateOptionState() {
        options.forEach((opt, i) => {
          const active = state.activeArea === "options" && state.optionIndex === i;
          opt.classList.toggle("is-active", active);
          opt.setAttribute("aria-current", active ? "page" : "false");
        });
      }

      /* live = true  → no CSS transition (finger tracking)
         live = false → CSS transition plays (snap / tap) */
      function setRotorLive(live) {
        rotor.style.transition = live ? "none" : "";
      }

      function updateWheelState() {
        rotor.style.transform = `rotate(${state.wheelRotation}deg)`;
        wheelStage.classList.toggle("is-active", state.activeArea === "wheel");
        updateLabelOrientation();

        let nearestIdx  = 0;
        let nearestDist = Infinity;
        const step = 360 / artworks.length;

        artworks.forEach((_, i) => {
          const angle = normalizeAngle(-90 + i * step + state.wheelRotation);
          const dist  = shortestAngleDistance(angle, selectionAngle);
          if (dist < nearestDist) { nearestDist = dist; nearestIdx = i; }
        });

        state.highlightedArtwork = nearestIdx;
        document.querySelectorAll(".artwork-label").forEach((label, i) => {
          label.classList.toggle("is-highlighted", i === nearestIdx);
        });
      }

      function render() { updateOptionState(); updateWheelState(); }

      function endLiveWheelScrollSoon() {
        if (wheelScrollEndTimer !== null) clearTimeout(wheelScrollEndTimer);
        wheelScrollEndTimer = setTimeout(() => {
          setRotorLive(false);
          wheelScrollEndTimer = null;
        }, 120);
      }

      function isContinuousWheelInput(e) {
        return e.deltaMode === 0 && Math.abs(e.deltaY) < 40;
      }

      function enterWheel() {
        state.activeArea  = "wheel";
        state.optionIndex = options.length - 1;
        render();
      }

      function leaveWheel(dir) {
        state.activeArea  = "options";
        state.optionIndex = dir === "up" ? options.length - 1 : 0;
        render();
      }

      function handleArrowDown(e) {
        e.preventDefault();
        if (currentPage !== "home") return;
        if (state.activeArea === "wheel") { state.wheelRotation -= 360 / artworks.length; render(); return; }
        if (state.optionIndex < options.length - 1) { state.optionIndex += 1; render(); }
        else { enterWheel(); }
      }

      function handleArrowUp(e) {
        e.preventDefault();
        if (currentPage !== "home") return;
        if (state.activeArea === "wheel") { leaveWheel("up"); return; }
        if (state.optionIndex > 0) { state.optionIndex -= 1; }
        else { state.optionIndex = -1; }
        render();
      }

      function openCurrentSelection() {
        if (currentPage !== "home") return;
        if (state.activeArea === "wheel") { showPage("artwork", { slug: artworks[state.highlightedArtwork].slug }); return; }
        if (state.optionIndex >= 0) {
          const sec = options[state.optionIndex].dataset.section;
          showPage("option", { section: sec });
        }
      }

      window.addEventListener("wheel", (e) => {
        if (currentPage !== "home") return;
        e.preventDefault();
        const liveWheel = isContinuousWheelInput(e);
        setRotorLive(liveWheel);
        state.activeArea  = "wheel";
        state.wheelRotation += e.deltaY * -0.18;
        render();
        if (liveWheel) endLiveWheelScrollSoon();
      }, { passive: false });

      window.addEventListener("keydown", (e) => {
        if (lightbox.classList.contains("is-open")) {
          if (e.key === "Escape") {
            e.preventDefault();
            closeLightbox();
          }
          if (e.key === "ArrowLeft") {
            e.preventDefault();
            moveLightbox(-1);
          }
          if (e.key === "ArrowRight") {
            e.preventDefault();
            moveLightbox(1);
          }
          return;
        }

        // On any subpage, Enter / Escape / Backspace / ArrowLeft goes back home.
        if (currentPage !== "home") {
          if (["Enter", "Escape", "Backspace", "ArrowLeft"].includes(e.key)) {
            e.preventDefault();
            goHome();
          }
          return;
        }
        if (e.key === "ArrowDown") handleArrowDown(e);
        if (e.key === "ArrowUp")   handleArrowUp(e);
        if (e.key === "Enter")     { e.preventDefault(); openCurrentSelection(); }
      });

      /* ── snap helper ── */
      function snapToNearestSlot() {
        const step = 360 / artworks.length;
        // Current rotation normalised — find how far we are from the nearest slot
        // A slot is "aligned" when (-90 + i*step + rotation) === selectionAngle
        // i.e. rotation = selectionAngle + 90 - i*step
        // We want the rotation value nearest to the current one that satisfies this.
        const base = selectionAngle + 90; // 315 for selectionAngle=225
        const remainder = ((state.wheelRotation - base) % step + step) % step;
        const snapDelta = remainder < step / 2 ? -remainder : (step - remainder);
        state.wheelRotation += snapDelta;
      }

      /* ── mobile star tap: advance one slot then snap ── */
      function tapStar(e) {
        if (lastTouchWasSwipe) return;
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
        if (currentPage !== "home") return;
        state.activeArea = "wheel";
        const step = 360 / artworks.length;
        state.wheelRotation -= step;   // advance one item (same direction as ArrowDown)
        snapToNearestSlot();           // guarantee perfect alignment
        render();
      }

      /* bind tap to every star polygon */
      document.querySelectorAll(".star-shape").forEach(star => {
        star.addEventListener("touchend",  tapStar, { passive: false });
        star.addEventListener("click",     tapStar);
      });

      /* also update the nav-hint text on narrow screens */
      (function updateNavHint() {
        const hint = document.querySelector(".nav-hint");
        if (!hint) return;
        const isTouch = window.matchMedia("(pointer: coarse)").matches;
        hint.textContent = isTouch
          ? "SWIPE · TAP · CLICK TITLES TO NAVIGATE"
          : "USE ARROWS AND SCROLL TO NAVIGATE";
      })();

      /* ── TOUCH SWIPE: spin the wheel by dragging anywhere on screen ── */
      (function initTouchSpin() {
        let touchStartY    = null;
        let touchStartRot  = null;
        let lastTouchY     = null;
        let lastTouchTime  = null;
        let velocity       = 0;      // degrees per ms
        let rafId          = null;
        let isSwiping      = false;

        /* sensitivity: px of vertical finger travel → degrees of rotation     */
        /* Negative because swiping up scrolls the wheel "forward" (same as    */
        /* scrolling down on desktop).                                          */
        const PX_PER_DEG = 2.2;

        function cancelMomentum() {
          if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
        }

        function momentumStep() {
          if (Math.abs(velocity) < 0.015) {
            /* velocity low enough — re-enable transition then snap cleanly */
            setRotorLive(false);
            snapToNearestSlot();
            render();
            rafId = null;
            return;
          }
          /* apply friction */
          velocity *= 0.92;
          state.wheelRotation += velocity * 16; /* ~16ms per frame */
          render();
          rafId = requestAnimationFrame(momentumStep);
        }

        window.addEventListener("touchstart", (e) => {
          if (currentPage !== "home") return;
          cancelMomentum();
          lastTouchWasSwipe = false;
          touchStartY   = e.touches[0].clientY;
          touchStartRot = state.wheelRotation;
          lastTouchY    = touchStartY;
          lastTouchTime = performance.now();
          velocity      = 0;
          isSwiping     = false;
        }, { passive: true });

        window.addEventListener("touchmove", (e) => {
          if (currentPage !== "home" || touchStartY === null) return;

          const y     = e.touches[0].clientY;
          const dy    = y - touchStartY;

          /* Only hijack vertical scrolls once we know it's a real swipe */
          if (!isSwiping && Math.abs(dy) > 6) {
            isSwiping = true;
            lastTouchWasSwipe = true;
            setRotorLive(true);   /* disable CSS transition while dragging */
          }
          if (!isSwiping) return;

          if (e.cancelable) e.preventDefault();

          /* velocity tracking */
          const now = performance.now();
          const dt  = now - lastTouchTime;
          if (dt > 0) {
            velocity = ((y - lastTouchY) / PX_PER_DEG) / dt;  /* deg/ms */
          }
          lastTouchY   = y;
          lastTouchTime = now;

          state.activeArea    = "wheel";
          state.wheelRotation = touchStartRot - dy / PX_PER_DEG;
          render();
        }, { passive: false });

        window.addEventListener("touchend", (e) => {
          if (currentPage !== "home" || touchStartY === null) return;
          if (!isSwiping) { touchStartY = null; return; }

          touchStartY = null;
          isSwiping   = false;
          setRotorLive(false);   /* re-enable CSS transition for snap */

          /* If there's meaningful momentum, coast then snap.              */
          /* Otherwise snap immediately.                                   */
          if (Math.abs(velocity) > 0.05) {
            rafId = requestAnimationFrame(momentumStep);
          } else {
            snapToNearestSlot();
            render();
          }
          setTimeout(() => { lastTouchWasSwipe = false; }, 0);
        }, { passive: true });
      })();

      buildWheel();
      render();
    </script>
  </body>
</html>
